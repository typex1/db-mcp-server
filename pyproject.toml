[project]
name = "db-mcp-server"
version = "1.0.0"
description = "MCP server wrapping Deutsche Bahn public APIs (StaDa, Timetables, FaSta, Parking)"
requires-python = ">=3.11"
# Pinned to the versions this clone was verified against (mcp 2.x API).
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "xmltodict==1.0.4",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "google-cloud-secret-manager==2.31.0",
    "Authlib==1.8.0",
]

# Flat layout with top-level modules, no installable package: `uv run` only
# needs the dependencies, not a build of this project.
[tool.uv]
package = false
